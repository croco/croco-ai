services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: "croco-keyphrase:latest"
    working_dir: "/home/croco/keyphrase"
    environment:
      - "LANG=ja_JP.UTF-8"
      - "LANGUAGE=ja"
    volumes:
      - $PWD/src:/home/croco/keyphrase
      - /models:/models
    tty: true

